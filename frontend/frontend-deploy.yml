# https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name:  frontend
      labels:
        app: frontend
    spec:
      # initContainers:
        # Init containers are exactly like regular containers, except:
          # - Init containers always run to completion.
          # - Each init container must complete successfully before the next one starts.
      containers:
      - name: frontend
        image: akashbora02/easycrudfe:v1
        ports:
        - containerPort: 80
        env:
          - name: VITE_API_URL
            value: "http://a86cc82dc70ab4314b8dca31178088fa-1043297742.us-east-1.elb.amazonaws.com:8080/api"
